spring.application.name=courses-management-system
# ===============================
# DATABASE CONNECTION
# ===============================
# The URL must match the database name you created in pgAdmin
spring.datasource.url=jdbc:postgresql://localhost:5432/courses-management-system

# Replace these with your actual PostgreSQL credentials
spring.datasource.username=postgres
spring.datasource.password=admin

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# Show the SQL queries Hibernate generates in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Since you already wrote your own SQL schema, set this to 'none' or 'validate'.
# 'validate' will check that your Java entities match your SQL tables exactly.
# 'none' will just connect without checking. 
spring.jpa.hibernate.ddl-auto=validate